version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    ports:
      - ":5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U  -d "]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: web_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: 
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: